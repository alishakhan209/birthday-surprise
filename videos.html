
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Videos ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<body class="videos-page">

</audio>

<button id="musicBtn">🎵</button>

<div class="background">

    <div class="moon"></div>

    <span>❤</span>
    <span>❤</span>
    <span>❤</span>

<div class="glass videos-card">

<p>
Some moments become memories...
And some memories become forever. ❤️
</p>

<div class="video-grid">

<div class="video-card">
<video controls preload="metadata">
<source src="videos/v1.mp4" type="video/mp4">
</video>

<div class="video-card">
<video controls preload="metadata">

<div class="video-card">

<div class="video-card">

<div class="video-card">
<video controls preload="metadata">
<source src="videos/v5.mp4" type="video/mp4">
</video>

</div>

<div class="video-card">
<video controls preload="metadata">
<source src="videos/v6.mp4" type="video/mp4">
</video>
<h4>My Forever & Always 💍❤️</h4>
</div>

</div>

<button id="nextVideo" class="loveBtn">
Read My Letter 💌
</button>

</div>

</section>

<script src="script.js"></script>
