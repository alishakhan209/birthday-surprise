<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday ❤️</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Loading Screen -->

    <div id="loader">

        <div class="loader-heart">❤️</div>

        <h2>Preparing Your Surprise...</h2>

    </div>

    <!-- Background -->

    <div class="background">

        <div class="stars"></div>

        <div class="moon"></div>

        <div class="overlay"></div>

    </div>

    <!-- Floating Hearts -->

    <div class="hearts">

        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>

    </div>

    <!-- Rose Petals -->

    <div class="petals">

        <span>🌹</span>
        <span>🌹</span>
        <span>🌹</span>
        <span>🌹</span>
        <span>🌹</span>

    </div>

    <!-- Main Card -->

    <section class="hero">

        <div class="glass">

            <h3>Happy Birthday</h3>

            <h1>Mere Handsome Jan❤️</h1>

            <p>

                Someone loves you
                more than words can say...

            </p>

            <p>

                Today is all about you.

            </p>

            <button id="startBtn">

                Start Our Journey ❤️

            </button>

        </div>

    </section>

    <!-- Script -->

    <script src="script.js"></script>

</body>

</html>
